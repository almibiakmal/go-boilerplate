name: CI/CD - Staging

on:
  push:
    branches:
      - staging
  pull_request:
    branches:
      - staging

env:
  GO_VERSION: "1.26"
  APP_ENV: "staging"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # STAGE 1: Continuous Integration (Lint, Test, Coverage & Binary Build)
  # ============================================================================
  ci-staging:
    name: "CI (Staging): Lint, Test & Build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify Go Dependencies
        run: |
          go mod download
          go mod verify

      - name: Run Static Analysis (go vet)
        run: go vet ./...

      - name: Run Unit & Integration Tests
        run: make test

      - name: Run Statement Coverage Report
        run: make test-cover

      - name: Build Application Binary
        run: make build

  # ============================================================================
  # STAGE 2: Build & Push Staging Docker Image
  # ============================================================================
  build-staging-image:
    name: "Package (Staging): Build & Push Docker Image"
    needs: ci-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Staging Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # STAGE 3: Deploy to Staging Environment (Migrate Up + Rolling Update)
  # ============================================================================
  deploy-staging:
    name: "CD (Staging): Migrate & Deploy"
    needs: build-staging-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging-api.example.com
    steps:
      - name: Run DB Migrations & Deploy to Staging
        run: |
          echo "Deploying ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }} to Staging..."
          # 1. Run pending database migrations (seeder is disabled in Staging to preserve QA/UAT data)
          # docker run --rm --env-file .env.staging ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }} migrate up
          # 2. Rolling update Staging container & verify /healthz and /readyz probes

