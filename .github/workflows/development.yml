name: CI/CD - Development

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

env:
  GO_VERSION: "1.26"
  APP_ENV: "development"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # STAGE 1: Continuous Integration (Lint, Test, Coverage & Binary Build)
  # ============================================================================
  ci-development:
    name: "CI (Development): Lint, Test & Build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify Go Dependencies
        run: |
          go mod download
          go mod verify

      - name: Run Static Analysis (go vet)
        run: go vet ./...

      - name: Run Unit & Integration Tests
        run: make test

      - name: Run Statement Coverage Report
        run: make test-cover

      - name: Build Application Binary
        run: make build

  # ============================================================================
  # STAGE 2: Build & Push Development Docker Image
  # ============================================================================
  build-development-image:
    name: "Package (Development): Build & Push Docker Image"
    needs: ci-development
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Development Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:development
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # STAGE 3: Deploy to Development Environment (Migrate Up + Seed + Serve)
  # ============================================================================
  deploy-development:
    name: "CD (Development): Migrate, Seed & Deploy"
    needs: build-development-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://dev-api.example.com
    steps:
      - name: Run DB Migrations, Seed Data & Deploy to Development
        run: |
          echo "Deploying ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-${{ github.sha }} to Development..."
          # 1. Run pending database migrations
          # docker run --rm --env-file .env.dev ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-${{ github.sha }} migrate up
          # 2. Run idempotent database seeder (enabled in Development)
          # docker run --rm --env-file .env.dev ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-${{ github.sha }} seed
          # 3. Restart Development container & verify /healthz and /readyz

