name: CI/CD - Production

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main

env:
  GO_VERSION: "1.26"
  APP_ENV: "production"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # STAGE 1: Continuous Integration (Lint, Test, Coverage & Binary Build)
  # ============================================================================
  ci-production:
    name: "CI (Production): Lint, Test & Build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify Go Dependencies
        run: |
          go mod download
          go mod verify

      - name: Run Static Analysis (go vet)
        run: go vet ./...

      - name: Run Unit & Integration Tests
        run: make test

      - name: Run Statement Coverage Report
        run: make test-cover

      - name: Build Application Binary
        run: make build

  # ============================================================================
  # STAGE 2: Build & Push Production Docker Image
  # ============================================================================
  build-production-image:
    name: "Package (Production): Build & Push Docker Image"
    needs: ci-production
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata & Semver Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=sha,prefix=prod-

      - name: Build and Push Production Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # STAGE 3: Deploy to Production Environment (Manual Approval + Zero-Downtime)
  # ============================================================================
  deploy-production:
    name: "CD (Production): Migrate & Zero-Downtime Rollout"
    needs: build-production-image
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.example.com
    steps:
      - name: Run DB Migrations & Zero-Downtime Rollout to Production
        run: |
          echo "Deploying ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:prod-${{ github.sha }} to Production..."
          # 1. Run pending database migrations (seeder is strictly disabled in Production)
          # docker run --rm --env-file .env.prod ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:prod-${{ github.sha }} migrate up
          # 2. Perform zero-downtime rolling update & verify /healthz and /readyz probes

