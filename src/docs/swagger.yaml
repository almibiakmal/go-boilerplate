basePath: /
definitions:
  requestdto.CreateCommentRequest:
    properties:
      content:
        maxLength: 2000
        minLength: 2
        type: string
    required:
    - content
    type: object
  requestdto.CreatePostRequest:
    properties:
      content:
        minLength: 10
        type: string
      is_published:
        type: boolean
      title:
        maxLength: 200
        minLength: 3
        type: string
    required:
    - content
    - title
    type: object
  requestdto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  requestdto.RegisterRequest:
    properties:
      email:
        maxLength: 150
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      password:
        maxLength: 72
        minLength: 6
        type: string
    required:
    - email
    - name
    - password
    type: object
  requestdto.UpdateCommentRequest:
    properties:
      content:
        maxLength: 2000
        minLength: 2
        type: string
    required:
    - content
    type: object
  requestdto.UpdatePostRequest:
    properties:
      content:
        minLength: 10
        type: string
      is_published:
        type: boolean
      title:
        maxLength: 200
        minLength: 3
        type: string
    required:
    - content
    - title
    type: object
  response.Code:
    enum:
    - SUCCESS
    - CREATED
    - BAD_REQUEST
    - VALIDATION_ERROR
    - UNAUTHORIZED
    - FORBIDDEN
    - NOT_FOUND
    - CONFLICT
    - DUPLICATE_ENTRY
    - TOO_MANY_REQUESTS
    - INTERNAL_SERVER_ERROR
    - SERVICE_UNAVAILABLE
    - DATABASE_ERROR
    type: string
    x-enum-varnames:
    - CodeSuccess
    - CodeCreated
    - CodeBadRequest
    - CodeValidationError
    - CodeUnauthorized
    - CodeForbidden
    - CodeNotFound
    - CodeConflict
    - CodeDuplicateEntry
    - CodeTooManyRequests
    - CodeInternalError
    - CodeServiceUnavailable
    - CodeDatabaseError
  response.Envelope:
    properties:
      code:
        $ref: '#/definitions/response.Code'
      data: {}
      error:
        $ref: '#/definitions/response.ErrorPayload'
      message:
        type: string
      meta:
        $ref: '#/definitions/response.PageMeta'
      success:
        type: boolean
    type: object
  response.ErrorPayload:
    properties:
      code:
        $ref: '#/definitions/response.Code'
      details:
        items:
          $ref: '#/definitions/response.FieldError'
        type: array
    type: object
  response.FieldError:
    properties:
      field:
        type: string
      message:
        type: string
    type: object
  response.PageMeta:
    properties:
      page:
        type: integer
      per_page:
        type: integer
      total_items:
        type: integer
      total_pages:
        type: integer
    type: object
  responsedto.AuthResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      token_type:
        type: string
      user:
        $ref: '#/definitions/responsedto.UserResponse'
    type: object
  responsedto.AuthorSummary:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  responsedto.CommentResponse:
    properties:
      author:
        $ref: '#/definitions/responsedto.AuthorSummary'
      author_id:
        type: integer
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      post_id:
        type: integer
      updated_at:
        type: string
    type: object
  responsedto.PostResponse:
    properties:
      author:
        $ref: '#/definitions/responsedto.AuthorSummary'
      author_id:
        type: integer
      comments_count:
        type: integer
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      is_published:
        type: boolean
      slug:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  responsedto.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      role:
        type: string
    type: object
info:
  contact: {}
  description: RESTful API Microservice Boilerplate (Fiber + GORM).
  title: Majoo Core Service API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Autentikasi user dengan email dan password untuk mendapatkan JWT
        access token
      parameters:
      - description: Login Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requestdto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/responsedto.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Login User
      tags:
      - Auth
  /api/v1/auth/me:
    get:
      description: Mengambil data profil user yang sedang login berdasarkan Bearer
        JWT token
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/responsedto.UserResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Get Current User Profile
      tags:
      - Auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Mendaftarkan akun user baru dan mengembalikan JWT access token
      parameters:
      - description: Register Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requestdto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/responsedto.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Envelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Register User
      tags:
      - Auth
  /api/v1/comments/{id}:
    delete:
      description: Menghapus komentar (hanya pembuat komentar yang diizinkan)
      parameters:
      - description: Comment ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Delete Comment
      tags:
      - Comments
    get:
      description: Mengambil detail satu komentar beserta informasi author
      parameters:
      - description: Comment ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/responsedto.CommentResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Get Comment by ID
      tags:
      - Comments
    put:
      consumes:
      - application/json
      description: Memperbarui isi komentar (hanya pembuat komentar yang diizinkan)
      parameters:
      - description: Comment ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update Comment Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requestdto.UpdateCommentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/responsedto.CommentResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Update Comment
      tags:
      - Comments
  /api/v1/posts:
    get:
      description: Mengambil daftar artikel blog dengan filter pencarian, author_id,
        dan pagination
      parameters:
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Items per page (default: 10, max: 100)'
        in: query
        name: per_page
        type: integer
      - description: Search by title or content
        in: query
        name: search
        type: string
      - description: Filter by Author ID
        in: query
        name: author_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/responsedto.PostResponse'
                  type: array
              type: object
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: List Posts
      tags:
      - Posts
    post:
      consumes:
      - application/json
      description: Membuat artikel blog baru (wajib login Bearer token)
      parameters:
      - description: Create Post Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requestdto.CreatePostRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/responsedto.PostResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Create Post
      tags:
      - Posts
  /api/v1/posts/{id}:
    delete:
      description: Menghapus artikel blog beserta komentarnya (hanya pemilik post
        yang diizinkan)
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Delete Post
      tags:
      - Posts
    get:
      description: Mengambil detail satu artikel blog beserta informasi author
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/responsedto.PostResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Get Post by ID
      tags:
      - Posts
    put:
      consumes:
      - application/json
      description: Memperbarui artikel blog (hanya pemilik post yang diizinkan)
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update Post Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requestdto.UpdatePostRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/responsedto.PostResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Update Post
      tags:
      - Posts
  /api/v1/posts/{postId}/comments:
    get:
      description: Mengambil daftar komentar pada suatu artikel blog dengan pagination
      parameters:
      - description: Post ID
        in: path
        name: postId
        required: true
        type: integer
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Items per page (default: 10, max: 100)'
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/responsedto.CommentResponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: List Comments by Post ID
      tags:
      - Comments
    post:
      consumes:
      - application/json
      description: Menambahkan komentar baru pada post dan menambah counter comments_count
        dalam satu transaksi DB
      parameters:
      - description: Post ID
        in: path
        name: postId
        required: true
        type: integer
      - description: Create Comment Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requestdto.CreateCommentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/responsedto.CommentResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Create Comment on Post
      tags:
      - Comments
  /healthz:
    get:
      description: Memeriksa apakah proses HTTP server masih hidup
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Liveness Probe
      tags:
      - Health
  /readyz:
    get:
      description: Memeriksa koneksi database dan menampilkan statistik connection
        pool
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Readiness Probe
      tags:
      - Health
schemes:
- http
- https
securityDefinitions:
  ApiKeyAuth:
    description: Internal Service-to-Service API Key
    in: header
    name: X-API-Key
    type: apiKey
  BearerAuth:
    description: 'Masukkan JWT token dengan format: Bearer <token>'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
